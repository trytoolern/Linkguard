name: Incorrect result or bug
description: Help reproduce a checking error or extension problem.
body:
  - type: markdown
    attributes:
      value: Do not include cookies, tokens, passwords, private page text, or private URLs.
  - type: input
    id: environment
    attributes:
      label: Firefox version and operating system
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Scan mode
      options:
        - Quick scan
        - Deep scan
        - Site and subdomains
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A public URL or a small local HTML example is useful, but optional.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: Include the displayed HTTP status and reason if relevant.
    validations:
      required: true
